<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:fragment="navbar">
        <!-- Natural Scrolling Command Header (No sticky/fixed positioning) -->
        <header class="border-bottom py-2 px-4 shadow-sm" style="border-bottom: 1px solid var(--bs-border-color) !important;">
            <div class="container-fluid px-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <!-- Brand / Portal Title -->
                <div class="d-flex align-items-center gap-3">
                    <a th:href="@{/dashboard}" class="d-flex align-items-center text-decoration-none">
                        <span class="badge bg-primary text-uppercase px-2 py-1 me-2 fw-bold">LEO PORTAL</span>
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-shield-shaded text-warning fs-5"></i>
                            <span class="fw-bold font-monospace text-body" style="letter-spacing: 0.5px;">CYBERCRIME INVESTIGATION &amp; INTELLIGENCE GRID</span>
                        </div>
                    </a>
                </div>

                <!-- Right-Side Controls: Clock, Theme Mode Toggle, Top-Right Workspace Dropdown -->
                <div class="d-flex align-items-center gap-2 font-monospace small">
                    <!-- Live Clocks -->
                    <span id="navIstClock" class="text-warning d-none d-lg-inline">IST: --:--:--</span>
                    <span id="navUtcClock" class="text-secondary me-2">UTC: --:--:--</span>

                    <!-- Technical Mode Toggle Button -->
                    <button id="themeModeToggle" class="btn btn-outline-secondary font-monospace small px-2 py-1" type="button" title="Toggle Tactical Theme">
                        <span id="themeModeLabel">[MODE: DARK]</span>
                    </button>

                    <!-- Top-Right Workspace Select Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2 px-2 py-1" 
                                type="button" id="workspaceSelectMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="font-monospace small">VIEW SELECT</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="workspaceSelectMenu">
                            <li><a class="dropdown-item py-2" th:href="@{/dashboard#ledgerSection}">1. Active Case Ledger</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/dashboard#intakeSection}">2. Register New Complaint</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/dashboard#sandboxSection}">3. Intelligence &amp; IoC Sandbox</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <script>
            (function() {
                // Live Clocks
                function updateNavClock() {
                    const now = new Date();
                    const ist = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour12: false });
                    const utc = now.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour12: false });
                    const istEl = document.getElementById('navIstClock');
                    const utcEl = document.getElementById('navUtcClock');
                    if (istEl) istEl.innerText = 'IST: ' + ist;
                    if (utcEl) utcEl.innerText = 'UTC: ' + utc;
                }
                setInterval(updateNavClock, 1000);
                updateNavClock();

                // Technical Theme Mode Toggle Logic
                const themeToggle = document.getElementById('themeModeToggle');
                const themeLabel = document.getElementById('themeModeLabel');
                const activeTheme = localStorage.getItem('app-theme') || 'dark';

                document.documentElement.setAttribute('data-bs-theme', activeTheme);
                if (themeLabel) {
                    themeLabel.textContent = activeTheme === 'dark' ? '[MODE: DARK]' : '[MODE: LIGHT]';
                }

                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        const current = document.documentElement.getAttribute('data-bs-theme') || 'dark';
                        const target = current === 'dark' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-bs-theme', target);
                        localStorage.setItem('app-theme', target);
                        if (themeLabel) {
                            themeLabel.textContent = target === 'dark' ? '[MODE: DARK]' : '[MODE: LIGHT]';
                        }
                    });
                }
            })();
        </script>
    </div>
</body>
</html>
