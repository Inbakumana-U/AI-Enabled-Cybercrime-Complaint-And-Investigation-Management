server.port=8080
spring.application.name=cybercrime-unified-platform
spring.profiles.active=docker

# PostgreSQL Container Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/cybercrime_db
spring.datasource.username=cyber_officer
spring.datasource.password=secure_ops_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB