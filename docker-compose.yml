services:
  cyber-db:
    image: postgres:16-alpine
    container_name: cybercrime-postgres-db
    restart: always
    environment:
      POSTGRES_DB: cybercrime_db
      POSTGRES_USER: cyber_officer
      POSTGRES_PASSWORD: secure_ops_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_officer -d cybercrime_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: